<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Optimizador de placas V3</title>
<style>
:root{--bg:#f5f5f3;--panel:#fff;--ink:#151515;--muted:#737373;--line:#d8d8d2;--soft:#ecece7;--accent:#111;--radius:16px}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit} button{cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px} input{font-size:16px} .seg button,.orientation button,.icon-btn,.add,.primary,.secondary{min-height:44px}
.app{max-width:1220px;margin:0 auto;padding:28px 18px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:22px;letter-spacing:-.02em;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.seg{display:inline-flex;background:var(--soft);padding:3px;border-radius:12px;gap:3px}.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;color:var(--muted)}.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.meta{font-size:12px;color:var(--muted);margin-left:auto}
.section-title{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px;color:#4b4b4b}
.piece-head,.piece-row{display:grid;grid-template-columns:minmax(150px,1.8fr) 96px 96px 190px 88px 76px 38px;gap:8px;align-items:center}.piece-head{font-size:11px;color:var(--muted);padding:0 4px 6px}.piece-row{padding:9px 0;border-top:1px solid var(--soft)}
input[type=text],input[type=number]{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;outline:none}input:focus{border-color:#999}
.orientation{display:flex;gap:4px}.orientation button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 6px;font-size:12px;color:var(--muted)}.orientation button.active{background:#161616;color:#fff;border-color:#161616}
.edge-picker{position:relative;width:64px;height:48px;touch-action:manipulation;border:1.5px solid #8d8d8d;margin:auto;background:#fafafa}.edge-picker button{position:absolute;border:0;background:transparent;padding:0}.edge-picker .top{left:10px;right:10px;top:-14px;height:28px}.edge-picker .bottom{left:10px;right:10px;bottom:-14px;height:28px}.edge-picker .left{top:8px;bottom:8px;left:-14px;width:28px}.edge-picker .right{top:8px;bottom:8px;right:-14px;width:28px}.edge-picker i{position:absolute;background:#111;opacity:0}.edge-picker i.on{opacity:1}.edge-picker .it{top:-2px;left:4px;right:4px;height:3px}.edge-picker .ib{bottom:-2px;left:4px;right:4px;height:3px}.edge-picker .il{left:-2px;top:4px;bottom:4px;width:3px}.edge-picker .ir{right:-2px;top:4px;bottom:4px;width:3px}
.icon-btn{border:0;background:transparent;color:#8a8a8a;font-size:20px;padding:4px}.icon-btn:hover{color:#111}.add{border:1px dashed #aaa;background:transparent;border-radius:10px;padding:9px 12px;margin-top:10px}.primary{border:0;background:#111;color:#fff;border-radius:12px;padding:11px 18px;font-weight:650}.secondary{border:1px solid var(--line);background:#fff;color:#111;border-radius:12px;padding:10px 15px;font-weight:600}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hidden{display:none!important}
.summary{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}.summary strong{color:var(--ink)}
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;align-items:start}.sheet-wrap{min-width:0}.sheet-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:13px}.sheet{position:relative;width:100%;background:#f7f7f4;border:1px solid #bcbcb5;box-shadow:0 2px 12px rgba(0,0,0,.05);overflow:hidden}.usable{position:absolute;border:1px dashed #c8c8c2;overflow:hidden;background:#fff}.piece{position:absolute;border:1px solid #242424;background:#f2f2ee;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;cursor:pointer;transition:filter .12s}.piece:hover{filter:brightness(.95)}.piece.changed{outline:2px solid #111;outline-offset:-3px}.piece-label{font-weight:650;line-height:1.08;pointer-events:none}.piece-dim{font-weight:450;color:#555;margin-top:2px;pointer-events:none}.tri{position:absolute;width:0;height:0;pointer-events:none}.tri.top{top:3px;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:0;border-bottom:7px solid #111}.tri.bottom{bottom:3px;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:0;border-top:7px solid #111}.tri.left{left:3px;top:50%;transform:translateY(-50%);border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:0;border-right:7px solid #111}.tri.right{right:3px;top:50%;transform:translateY(-50%);border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:0;border-left:7px solid #111}
.editor{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center;padding:18px;z-index:20}.editor-card{width:min(440px,100%);background:white;border-radius:18px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.18)}.editor-card h3{margin:0 0 6px;font-size:18px}.editor-card p{margin:0 0 14px;color:var(--muted);font-size:13px}.editor .orientation button{padding:10px}.note{font-size:12px;color:var(--muted);margin-top:9px}.empty{padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media(max-width:820px){.piece-head{display:none}.piece-row{grid-template-columns:1fr 1fr;gap:8px;padding:12px 0}.piece-row .name{grid-column:1/-1}.piece-row .orientation{grid-column:1/-1}.piece-row .cant-col{justify-self:start}.piece-row .remove{justify-self:end}.meta{width:100%;margin-left:0}.sheets{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div><h1>Optimizador de placas</h1><div class="sub">Ancho manda · largo manda · rellenar hacia atrás</div></div></div>

  <section class="card">
    <h2 class="section-title">Placa</h2>
    <div class="row">
      <div class="seg" id="brandSeg"><button data-brand="egger" class="active">Egger</button><button data-brand="faplac">Faplac</button></div>
      <div class="seg" id="grainSeg"><button data-grain="grain" class="active">Con veta</button><button data-grain="plain">Lisa</button></div>
      <div class="meta" id="plateMeta">1830 × 2600 mm · vertical</div>
    </div>
  </section>

  <section class="card" id="inputCard">
    <h2 class="section-title">Piezas</h2>
    <div class="piece-head"><div>Nombre</div><div>Ancho</div><div>Largo</div><div>Orientación</div><div>Cantos</div><div>Cantidad</div><div></div></div>
    <div id="rows"></div>
    <button class="add" id="addBtn">+ Agregar pieza</button>
    <div class="actions"><button class="primary" id="optBtn">Optimizar</button></div>
  </section>

  <section class="card hidden" id="resultCard">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 class="section-title" style="margin-bottom:6px">Desarrollo</h2><div class="summary" id="summary"></div></div><button class="secondary" id="backBtn">Editar lista</button></div>
    <div class="sheets" id="sheets"></div>
    <div class="actions"><button class="primary" id="recalcBtn">Recalcular</button></div>
    <div class="note">Los cambios de orientación quedan pendientes hasta tocar “Recalcular”.</div>
  </section>
</div>

<div class="editor hidden" id="editor">
  <div class="editor-card">
    <h3 id="editTitle">Pieza</h3><p id="editSub"></p>
    <div class="orientation" id="editOrientation">
      <button data-o="v">↕ Vertical</button><button data-o="h">↔ Horizontal</button><button data-o="a">Auto</button>
    </div>
    <div class="actions"><button class="secondary" id="closeEdit">Cerrar</button></div>
  </div>
</div>

<script>
const PLATES={egger:{w:1830,h:2600,name:'Egger'},faplac:{w:1830,h:2750,name:'Faplac'}};
const MARGIN_TOTAL=40; // 20 mm por lado, 40 mm descontados de cada dimensión
let state={brand:'egger',grain:'grain',rows:[],lastLayout:null,pendingOverrides:{},editingInstance:null};
let rowSeq=1;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function addRow(data={}){
  state.rows.push({id:'r'+rowSeq++,name:data.name||'',w:data.w||'',h:data.h||'',orientation:data.orientation||'v',edges:data.edges||{t:false,r:false,b:false,l:false},qty:data.qty||1});
  renderRows();
}
function renderRows(){
  const root=$('#rows');root.innerHTML='';
  state.rows.forEach(r=>{
    const el=document.createElement('div');el.className='piece-row';el.dataset.id=r.id;
    el.innerHTML=`
      <input class="name" type="text" placeholder="Nombre" value="${esc(r.name)}">
      <input class="w" type="number" min="1" step="1" placeholder="Ancho" value="${r.w}">
      <input class="h" type="number" min="1" step="1" placeholder="Largo" value="${r.h}">
      <div class="orientation"><button data-o="v">↕ Vertical</button><button data-o="h">↔ Horizontal</button><button data-o="a">Auto</button></div>
      <div class="cant-col"><div class="edge-picker" title="Seleccionar cantos">
        <button class="top" data-e="t"></button><button class="right" data-e="r"></button><button class="bottom" data-e="b"></button><button class="left" data-e="l"></button>
        <i class="it ${r.edges.t?'on':''}"></i><i class="ir ${r.edges.r?'on':''}"></i><i class="ib ${r.edges.b?'on':''}"></i><i class="il ${r.edges.l?'on':''}"></i>
      </div></div>
      <input class="qty" type="number" min="1" step="1" value="${r.qty}">
      <button class="icon-btn remove" title="Eliminar">×</button>`;
    root.appendChild(el);
    updateOrientationButtons(el,r.orientation);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function updateOrientationButtons(root,o){root.querySelectorAll('.orientation button').forEach(b=>b.classList.toggle('active',b.dataset.o===o))}
function syncRow(el){const r=state.rows.find(x=>x.id===el.dataset.id);if(!r)return;r.name=el.querySelector('.name').value;r.w=+el.querySelector('.w').value||0;r.h=+el.querySelector('.h').value||0;r.qty=Math.max(1,+el.querySelector('.qty').value||1)}

$('#rows').addEventListener('input',e=>{const row=e.target.closest('.piece-row');if(row)syncRow(row)});
$('#rows').addEventListener('click',e=>{const row=e.target.closest('.piece-row');if(!row)return;const r=state.rows.find(x=>x.id===row.dataset.id);if(e.target.matches('.orientation button')){r.orientation=e.target.dataset.o;updateOrientationButtons(row,r.orientation)}if(e.target.closest('.edge-picker button')){const edge=e.target.closest('button').dataset.e;r.edges[edge]=!r.edges[edge];renderRows()}if(e.target.matches('.remove')){state.rows=state.rows.filter(x=>x.id!==r.id);renderRows()}});
function tap(id,fn){const el=$(id);el.addEventListener('click',fn,{passive:false})}
tap('#addBtn',()=>addRow());

$('#brandSeg').addEventListener('click',e=>{if(!e.target.dataset.brand)return;state.brand=e.target.dataset.brand;$$('#brandSeg button').forEach(b=>b.classList.toggle('active',b.dataset.brand===state.brand));const p=PLATES[state.brand];$('#plateMeta').textContent=`${p.w} × ${p.h} mm · vertical`});
$('#grainSeg').addEventListener('click',e=>{if(!e.target.dataset.grain)return;state.grain=e.target.dataset.grain;$$('#grainSeg button').forEach(b=>b.classList.toggle('active',b.dataset.grain===state.grain))});

function expandRows(){
  const out=[];for(const r of state.rows){if(!r.w||!r.h||!r.qty)continue;for(let i=0;i<r.qty;i++)out.push({instanceId:`${r.id}:${i+1}`,rowId:r.id,index:i+1,name:r.name||'Pieza',baseW:r.w,baseH:r.h,orientation:r.orientation,edges:{...r.edges}})}return out;
}
function oriented(p,o){return o==='h'?{w:p.baseH,h:p.baseW}:{w:p.baseW,h:p.baseH}}
function edgeMap(edges,o){if(o!=='h')return {...edges};return {t:edges.l,r:edges.t,b:edges.r,l:edges.b}}

function prefOrientation(p){
  return Object.prototype.hasOwnProperty.call(state.pendingOverrides,p.instanceId)?state.pendingOverrides[p.instanceId]:p.orientation;
}

// V5 — DOS FASES:
// Fase 1: Vertical/Horizontal siguen exactamente la lógica V4.
// Fase 2: Auto queda para el final y funciona como comodín de aprovechamiento.
function layoutTwoPhase(instances,plate){
  const U={w:plate.w-MARGIN_TOTAL,h:plate.h-MARGIN_TOTAL};
  const fixed=[],autos=[],invalid=[];

  for(const p of instances){
    const pr=prefOrientation(p);
    if(pr==='a'){
      const fitsV=p.baseW<=U.w&&p.baseH<=U.h;
      const fitsH=p.baseH<=U.w&&p.baseW<=U.h;
      if(fitsV||fitsH) autos.push({...p}); else invalid.push(p);
    }else{
      const d=oriented(p,pr);
      if(d.w<=U.w&&d.h<=U.h) fixed.push({...p,resolved:pr,w:d.w,h:d.h,drawEdges:edgeMap(p.edges,pr)});
      else invalid.push(p);
    }
  }

  // ---------- FASE 1: piezas con orientación fija ----------
  const groups=new Map();
  fixed.forEach(p=>{if(!groups.has(p.w))groups.set(p.w,[]);groups.get(p.w).push(p)});
  const widths=[...groups.keys()].sort((a,b)=>b-a);
  widths.forEach(w=>groups.get(w).sort((a,b)=>b.h-a.h || a.instanceId.localeCompare(b.instanceId)));

  let placements=[],holes=[],plateIndex=0,x=0,plates=1,holeSeq=1;
  const newPlate=()=>{plateIndex++;plates=Math.max(plates,plateIndex+1);x=0};
  function addHole(h){if(h.w>0&&h.h>0)holes.push({...h,holeId:holeSeq++})}

  function splitHoleWithPiece(hidx,p,source='backfill'){
    const h=holes[hidx];
    placements.push({...p,plate:h.plate,x:h.x,y:h.y,source});
    holes.splice(hidx,1);
    // Debajo: conserva el ancho exacto de la pieza.
    addHole({plate:h.plate,x:h.x,y:h.y+p.h,w:p.w,h:h.h-p.h,age:(h.age||0)+0.1,continuationKey:`${p.w}x${p.h}`});
    // Derecha: conserva toda la altura original del hueco.
    addHole({plate:h.plate,x:h.x+p.w,y:h.y,w:h.w-p.w,h:h.h,age:(h.age||0)+0.2,continuationKey:null});
  }

  function findFixedHole(p){
    const candidates=holes.map((h,i)=>({h,i})).filter(z=>p.w<=z.h.w&&p.h<=z.h.h);
    candidates.sort((a,b)=>{
      const key=`${p.w}x${p.h}`;
      const ac=a.h.continuationKey===key?0:1,bc=b.h.continuationKey===key?0:1;
      return ac-bc || a.h.plate-b.h.plate || a.h.x-b.h.x || a.h.y-b.h.y || a.h.w*a.h.h-b.h.w*b.h.h || a.h.holeId-b.h.holeId;
    });
    return candidates.length?candidates[0].i:-1;
  }

  widths.forEach((gw,gi)=>{
    const arr=[...groups.get(gw)];
    let strip=null;
    function ensureStrip(){
      if(strip)return;
      if(x+gw>U.w)newPlate();
      strip={plate:plateIndex,x,width:gw,usedH:0};x+=gw;
    }
    function closeStrip(){
      if(strip){addHole({plate:strip.plate,x:strip.x,y:strip.usedH,w:strip.width,h:U.h-strip.usedH,age:placements.length,continuationKey:null});strip=null}
    }
    for(const p of arr){
      if(gi>0){const hi=findFixedHole(p);if(hi>=0){splitHoleWithPiece(hi,p,'backfill');continue}}
      ensureStrip();
      if(strip.usedH+p.h>U.h){closeStrip();ensureStrip()}
      placements.push({...p,plate:strip.plate,x:strip.x,y:strip.usedH,source:'natural'});strip.usedH+=p.h;
    }
    closeStrip();
  });

  // Si no hubo piezas fijas, todavía comenzamos en placa 1 desde x=0.
  // Si hubo rellenos a la derecha del cursor natural, actualizamos el borde real ocupado de la última placa.
  function occupiedRight(pi){
    return placements.filter(p=>p.plate===pi).reduce((m,p)=>Math.max(m,p.x+p.w),0);
  }
  x=Math.max(x,occupiedRight(plateIndex));

  // ---------- FASE 2: AUTO ----------
  // Cada Auto genera hasta dos variantes; se comparan GLOBALMENTE contra TODOS los huecos.
  let remaining=[...autos];
  const variants=p=>{
    const out=[];
    if(p.baseW<=U.w&&p.baseH<=U.h)out.push({...p,resolved:'v',w:p.baseW,h:p.baseH,drawEdges:edgeMap(p.edges,'v')});
    if(p.baseH<=U.w&&p.baseW<=U.h && (p.baseW!==p.baseH))out.push({...p,resolved:'h',w:p.baseH,h:p.baseW,drawEdges:edgeMap(p.edges,'h')});
    return out;
  };

  function bestAutoHoleCandidate(){
    let best=null;
    for(const p of remaining){
      for(const v of variants(p)){
        for(let hi=0;hi<holes.length;hi++){
          const h=holes[hi];if(v.w>h.w||v.h>h.h)continue;
          const waste=h.w*h.h-v.w*v.h;
          const shortSide=Math.min(h.w-v.w,h.h-v.h);
          const longSide=Math.max(h.w-v.w,h.h-v.h);
          const cand={p,v,hi,h,waste,shortSide,longSide};
          if(!best || waste<best.waste ||
             (waste===best.waste&&shortSide<best.shortSide) ||
             (waste===best.waste&&shortSide===best.shortSide&&longSide<best.longSide) ||
             (waste===best.waste&&shortSide===best.shortSide&&longSide===best.longSide&&h.plate<best.h.plate) ||
             (waste===best.waste&&shortSide===best.shortSide&&longSide===best.longSide&&h.plate===best.h.plate&&h.x<best.h.x) ||
             (waste===best.waste&&shortSide===best.shortSide&&longSide===best.longSide&&h.plate===best.h.plate&&h.x===best.h.x&&h.y<best.h.y)) best=cand;
        }
      }
    }
    return best;
  }

  function removeRemaining(instanceId){remaining=remaining.filter(p=>p.instanceId!==instanceId)}

  // A) Vaciar al máximo los huecos existentes antes de abrir espacio nuevo.
  while(remaining.length){
    const best=bestAutoHoleCandidate();
    if(!best)break;
    splitHoleWithPiece(best.hi,best.v,'auto-backfill');
    removeRemaining(best.p.instanceId);
  }

  // B) Ya no cabe ninguna Auto en los huecos existentes: recién ahora se abren nuevas tiras.
  // Para elegir la nueva tira probamos cada pieza/orientación como "semilla" y estimamos
  // cuánto puede llenar verticalmente esa columna con las Auto restantes.
  function simulateStrip(seed,all){
    const width=seed.w;let used=seed.h,area=seed.w*seed.h,chosen=[seed.instanceId];
    let pool=all.filter(p=>p.instanceId!==seed.instanceId);
    while(true){
      let best=null;
      for(const p of pool){
        for(const v of variants(p)){
          if(v.w>width||used+v.h>U.h)continue;
          // Dentro de una tira ya abierta: preferimos mayor área ocupada y menor hueco lateral.
          const lateral=width-v.w;
          const cand={v,area:v.w*v.h,lateral};
          if(!best||cand.area>best.area||(cand.area===best.area&&cand.lateral<best.lateral))best=cand;
        }
      }
      if(!best)break;
      used+=best.v.h;area+=best.v.w*best.v.h;chosen.push(best.v.instanceId);pool=pool.filter(p=>p.instanceId!==best.v.instanceId);
    }
    return {width,used,area,waste:width*U.h-area,fill:area/(width*U.h),chosen};
  }

  function chooseStripSeed(){
    let best=null;
    for(const p of remaining){
      for(const v of variants(p)){
        const sim=simulateStrip(v,remaining);
        const cand={v,sim};
        if(!best || sim.waste<best.sim.waste ||
          (sim.waste===best.sim.waste&&sim.width<best.sim.width) ||
          (sim.waste===best.sim.waste&&sim.width===best.sim.width&&sim.used>best.sim.used))best=cand;
      }
    }
    return best;
  }

  while(remaining.length){
    let seed=chooseStripSeed();if(!seed)break;
    // Si la tira elegida no entra a la derecha, pasamos a la placa siguiente y recalculamos desde x=0.
    if(x+seed.sim.width>U.w){newPlate();seed=chooseStripSeed();if(!seed)break}
    const strip={plate:plateIndex,x,width:seed.sim.width,usedH:0};x+=strip.width;

    while(remaining.length){
      let best=null;
      for(const p of remaining){
        for(const v of variants(p)){
          if(v.w>strip.width||strip.usedH+v.h>U.h)continue;
          const remainingH=U.h-(strip.usedH+v.h);
          const lateral=strip.width-v.w;
          const waste=lateral*v.h + strip.width*remainingH;
          const cand={p,v,waste,lateral,remainingH};
          if(!best||waste<best.waste||(waste===best.waste&&lateral<best.lateral)||(waste===best.waste&&lateral===best.lateral&&remainingH<best.remainingH))best=cand;
        }
      }
      if(!best)break;
      placements.push({...best.v,plate:strip.plate,x:strip.x,y:strip.usedH,source:'auto-strip'});
      // Si la pieza es más angosta que la tira, el espacio lateral de SU tramo también queda disponible.
      addHole({plate:strip.plate,x:strip.x+best.v.w,y:strip.usedH,w:strip.width-best.v.w,h:best.v.h,age:placements.length,continuationKey:null});
      strip.usedH+=best.v.h;removeRemaining(best.p.instanceId);

      // Antes de seguir apilando, una Auto restante puede encajar mejor en cualquier hueco creado.
      while(remaining.length){const c=bestAutoHoleCandidate();if(!c)break;splitHoleWithPiece(c.hi,c.v,'auto-backfill');removeRemaining(c.p.instanceId)}
    }
    addHole({plate:strip.plate,x:strip.x,y:strip.usedH,w:strip.width,h:U.h-strip.usedH,age:placements.length,continuationKey:null});
  }

  return {placements,holes,plates,invalid,U};
}

function optimize(){
  document.querySelectorAll('.piece-row').forEach(syncRow);
  const instances=expandRows();if(!instances.length){alert('Cargá al menos una pieza con medidas.');return}
  const plate=PLATES[state.brand];const layout=layoutTwoPhase(instances,plate);state.lastLayout=layout;renderResult(layout,plate);$('#inputCard').classList.add('hidden');$('#resultCard').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});
}
tap('#optBtn',optimize);tap('#recalcBtn',optimize);tap('#backBtn',()=>{$('#resultCard').classList.add('hidden');$('#inputCard').classList.remove('hidden')});

function renderResult(layout,plate){
  const area=layout.placements.reduce((s,p)=>s+p.w*p.h,0),usableArea=layout.plates*layout.U.w*layout.U.h,waste=Math.max(0,usableArea-area),pct=usableArea?100*waste/usableArea:0;
  $('#summary').innerHTML=`<span><strong>${layout.plates}</strong> placa${layout.plates!==1?'s':''}</span><span><strong>${layout.placements.length}</strong> piezas</span><span><strong>${pct.toFixed(1)}%</strong> libre</span>${layout.invalid.length?`<span><strong>${layout.invalid.length}</strong> no entran</span>`:''}`;
  const root=$('#sheets');root.innerHTML='';
  const insetX=20/plate.w*100,insetY=20/plate.h*100,usableW=(plate.w-40)/plate.w*100,usableH=(plate.h-40)/plate.h*100;
  for(let pi=0;pi<layout.plates;pi++){
    const wrap=document.createElement('div');wrap.className='sheet-wrap';wrap.innerHTML=`<div class="sheet-title"><strong>Placa ${pi+1}</strong><span>${PLATES[state.brand].name}</span></div><div class="sheet" style="aspect-ratio:${plate.w}/${plate.h}"><div class="usable" style="left:${insetX}%;top:${insetY}%;width:${usableW}%;height:${usableH}%"></div></div>`;
    const sheet=wrap.querySelector('.sheet'),usable=wrap.querySelector('.usable');
    layout.placements.filter(p=>p.plate===pi).forEach(p=>{
      const el=document.createElement('div');el.className='piece'+(state.pendingOverrides[p.instanceId]?' changed':'');el.dataset.instance=p.instanceId;
      el.style.left=(p.x/layout.U.w*100)+'%';el.style.top=(p.y/layout.U.h*100)+'%';el.style.width=(p.w/layout.U.w*100)+'%';el.style.height=(p.h/layout.U.h*100)+'%';
      const fs=Math.max(7,Math.min(13,Math.min(p.w,p.h)/55));
      el.innerHTML=`<div style="font-size:${fs}px"><div class="piece-label">${esc(p.name)}</div><div class="piece-dim">${p.w} × ${p.h}</div></div>${triangles(p.drawEdges)}`;
      usable.appendChild(el);
    });
    root.appendChild(wrap);
  }
}
function triangles(e){return `${e.t?'<i class="tri top"></i>':''}${e.r?'<i class="tri right"></i>':''}${e.b?'<i class="tri bottom"></i>':''}${e.l?'<i class="tri left"></i>':''}`}

$('#sheets').addEventListener('click',e=>{const el=e.target.closest('.piece');if(!el||!state.lastLayout)return;const p=state.lastLayout.placements.find(x=>x.instanceId===el.dataset.instance);if(!p)return;state.editingInstance=p.instanceId;$('#editTitle').textContent=p.name;$('#editSub').textContent=`${p.baseW} × ${p.baseH} mm · pieza ${p.index}`;const current=state.pendingOverrides[p.instanceId]||p.orientation;updateOrientationButtons($('#editOrientation'),current);$('#editor').classList.remove('hidden')});
$('#editOrientation').addEventListener('click',e=>{if(!e.target.dataset.o||!state.editingInstance)return;state.pendingOverrides[state.editingInstance]=e.target.dataset.o;updateOrientationButtons($('#editOrientation'),e.target.dataset.o);const el=document.querySelector(`.piece[data-instance="${CSS.escape(state.editingInstance)}"]`);if(el)el.classList.add('changed')});
tap('#closeEdit',()=>$('#editor').classList.add('hidden'));$('#editor').addEventListener('click',e=>{if(e.target===$('#editor'))$('#editor').classList.add('hidden')});

addRow({name:'',orientation:'v',qty:1});
</script>
</body>
